[package]
name = "bee-detector"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Linux dataset catalog and native segmentation data viewer for beekeepers"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
pathdiff = "0.2"
png = "0.17.16"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
