name: Linux
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Native window smoke test
        run: |
          set +e
          timeout 5s xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET WINIT_UNIX_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 target/debug/bee-detector --catalog /tmp/bee-smoke/catalog.sqlite3 bee-data
          status=$?
          test "$status" -eq 124
  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy Pillow opencv-python-headless
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python pytorch.py --self-test
